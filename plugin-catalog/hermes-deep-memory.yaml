description: "Deep markdown-file memory for Hermes Agent: a tree of .md files is the truth, SQLite FTS5 plus optional local-embedding vectors are the derived index. Seven memory_* tools, per-turn ephemeral recall suggestions (injected at API-call time only — prompt-cache safe), a git-versioned store with per-section change history, and a background consolidator. Disclosure — local by default: all reads/writes stay inside the plugin's own store under $HERMES_HOME/deep-memory, committed to a local git repo; optional user-configured embed/LLM endpoints (README points them at your own box; no third-party calls by default), no telemetry, no credentials, no shell."
maintainer: rain-sk
tier: community
category: memory
requires_hermes: ">=0.21.5"
