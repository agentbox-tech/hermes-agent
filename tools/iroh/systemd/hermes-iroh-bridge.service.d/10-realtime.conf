[Service]
# Realtime transport: QUIC/iroh keepalives and WS proxying are latency-
# sensitive single-threaded asyncio. On shared-CPU hosts (small ARM boxes
# that also compile, sync, or index), the bridge can miss keepalives when
# the scheduler is saturated, producing silent "connection closed" bursts.
# CPUWeight (cgroup v2) makes the bridge win the core under contention
# without any privilege requirement — unlike Nice<0, it works rootless.
CPUWeight=1000
